<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poudlard TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/owl.css">
<link rel="stylesheet" href="css/rappeltout.css">
<link rel="stylesheet" href="css/beuglante.css">
<link rel="stylesheet" href="css/screens/sorting.css">
<link rel="stylesheet" href="css/screens/home.css">
<link rel="stylesheet" href="css/screens/map.css">
<link rel="stylesheet" href="css/screens/ollivanders.css">
<link rel="stylesheet" href="css/screens/settings.css">
<link rel="stylesheet" href="css/screens/classic.css">
</head>
<body>
<div class="bench">
  <header class="bench-head">
    <h1>Poudlard TV</h1>
    <p>Maquette interactive du launcher. Clique sur l'écran, puis flèches, Entrée (OK, appui long = menu), Échap (retour), M (réglages).</p>
  </header>
  <div class="bench-main">
    <div class="tv-frame">
      <div id="stage" class="stage" tabindex="0" aria-label="Écran de télévision simulé"></div>
    </div>
    <aside class="bench-side" id="dev">
      <section>
        <h2>Télécommande</h2>
        <div class="remote">
          <span></span><button class="rb dev" data-action="up" aria-label="Haut">▲</button><span></span>
          <button class="rb dev" data-action="left" aria-label="Gauche">◀</button>
          <button class="rb ok dev" data-action="ok" aria-label="OK">OK</button>
          <button class="rb dev" data-action="right" aria-label="Droite">▶</button>
          <span></span><button class="rb dev" data-action="down" aria-label="Bas">▼</button><span></span>
        </div>
        <div class="remote-row">
          <button class="rb wide dev" data-action="back">Retour</button>
          <button class="rb wide dev" data-action="menu">Menu</button>
          <button class="rb wide dev" data-action="longok">OK long</button>
          <button class="rb wide dev" data-action="longback">Retour long</button>
        </div>
      </section>
      <section>
        <h2>Banc d'essai</h2>
        <label class="toggle"><input type="checkbox" id="dev-slow"> Ralenti ×3, pour régler les gestes</label>
        <button class="rb wide dev" id="dev-fs" type="button">Plein écran</button>
        <p class="hint">Les vrais réglages (applis visibles, thème, chouette, sons, veille) sont dans l'interface elle-même : touche M.</p>
      </section>
    </aside>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
